<div class="wrap">

    <h1 class="title">Enlaces directos de PDF</h1>
    <p class="sub">Seleccione un PDF y copie su enlace RAW. No hay que modificar ninguna URL.</p>
    <div class="tools">
      <input id="search" class="search" placeholder="Buscar por nombre o carpeta…" autocomplete="off">

<script>
const API='https://api.github.com/repos/Uamnica/UAM/git/trees/main?recursive=1';
const RAW='https://raw.githubusercontent.com/Uamnica/UAM/main/';
let files=[];
const $=id=>document.getElementById(id);
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function render(){
 const q=$('search').value.trim().toLowerCase();
 const data=files.filter(f=>!q || f.path.toLowerCase().includes(q));
 $('status').textContent=`${data.length} PDF${data.length===1?'':'s'} disponible${data.length===1?'':'s'}`;
 if(!data.length){$('list').innerHTML='<div class="empty">No se encontraron PDFs.</div>';return;}
 $('list').innerHTML=data.map((f,i)=>`<div class="row"><div class="name"><div class="file">${escapeHtml(f.name)}</div><div class="path">${escapeHtml(f.path)}</div></div><button class="copy" data-i="${i}">📋 Copiar enlace</button></div>`).join('');
 [...document.querySelectorAll('.copy')].forEach(btn=>btn.onclick=async()=>{
   const f=data[Number(btn.dataset.i)];
   const url=RAW+f.path.split('/').map(encodeURIComponent).join('/');
   try{await navigator.clipboard.writeText(url);}catch(e){const ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
   btn.textContent='✓ Copiado';btn.classList.add('ok');setTimeout(()=>{btn.textContent='📋 Copiar enlace';btn.classList.remove('ok')},1600);
 });
}
async function load(){
 $('status').innerHTML='<span class="spinner"></span> Cargando PDFs…';$('list').innerHTML='';
 try{const r=await fetch(API,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error('GitHub API '+r.status);const j=await r.json();files=(j.tree||[]).filter(x=>x.type==='blob'&&x.path.toLowerCase().endsWith('.pdf')).map(x=>({path:x.path,name:x.path.split('/').pop()})).sort((a,b)=>a.path.localeCompare(b.path,'es'));render();}
 catch(e){$('status').textContent='No se pudo cargar la lista de GitHub.';$('list').innerHTML='<div class="empty">Verifique la conexión a Internet y pulse “Actualizar lista”.</div>';console.error(e);}
}
$('search').addEventListener('input',render);$('reload').onclick=load;load();
</script>
